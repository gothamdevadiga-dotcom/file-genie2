<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:8000 http://localhost:8000">
  <title>File Genie</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brandMark"></div>
        <div class="brand-text">
          <div class="brand-name">File Genie</div>
          <div class="brand-sub">File organizer</div>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Main"></nav>

      <button class="btn btn-primary btn-block" id="sidebarScan" type="button">Scan a folder</button>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="status" id="status" data-state="checking">
          <span class="dot"></span>
          <span id="statusText">Checking backend…</span>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
